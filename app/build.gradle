plugins { id 'com.android.application' }
android {
    namespace 'org.zektopic.zekals'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'org.zektopic.zekals'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild { cmake { cppFlags '-O2' } }
    }
    buildFeatures { buildConfig true }
    flavorDimensions 'capability'
    productFlavors {
        lite {
            dimension 'capability'
            buildConfigField 'boolean', 'CAMERA_AVAILABLE', 'false'
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        }
        vision {
            dimension 'capability'
            buildConfigField 'boolean', 'CAMERA_AVAILABLE', 'true'
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
    }
    externalNativeBuild { cmake { path file('../CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    lint { abortOnError true }
}
dependencies {
    // tasks-core always constructs a datatransport (Clearcut) usage logger; FaceLandmarker fails with
    // NoClassDefFoundError if that library is excluded. INTERNET is removed, so it cannot upload.
    visionImplementation 'com.google.mediapipe:tasks-vision:1.0.0'
    visionImplementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}

// The face model is not committed. Without this check a Vision APK builds fine and then
// can only report "eye tracking could not start" on every device.
def visionModel = file('src/vision/assets/face_landmarker.task')
def verifyVisionModel = tasks.register('verifyVisionModel') {
    inputs.file(visionModel).optional()
    doLast {
        if (!visionModel.isFile()) throw new GradleException("Missing ${visionModel}. Run: python3 scripts/download_model.py")
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(visionModel.bytes).encodeHex().toString()
        // Keep in sync with scripts/download_model.py and MediaPipeEstimator.CHECKSUM.
        if (actual != '64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff') {
            throw new GradleException("face_landmarker.task checksum mismatch (${actual}). Re-run scripts/download_model.py")
        }
    }
}
tasks.configureEach { if (it.name ==~ /preVision(Debug|Release)Build/) it.dependsOn(verifyVisionModel) }
